<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padel-Masters</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Padel-Masters">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: App-Leiste oben (Marine), Inhalt in ruhigen weißen Karten, Navigation unten am Handy / oben rechts am Desktop */
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#0d1526; --ink-2:#334155; --muted:#6b7689; --line:#e6eaf0;
  --primary:#2150d6; --primary-ink:#ffffff; --primary-soft:#eaf0fd;
  --navy:#0c1a36; --navy-2:#162a52; --ball:#d9f24b; --ball-ink:#1a2600;
  --good:#138a48; --good-bg:#e4f5eb; --bad:#d23a2a; --bad-bg:#fdecea; --info:#2150d6; --info-bg:#eaf0fd;
  --shadow:0 1px 2px rgba(13,21,38,.05),0 4px 14px rgba(13,21,38,.05);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1020; --surface:#121a2c; --surface-2:#18223a; --ink:#e9eef7; --ink-2:#c3cbd9; --muted:#8c98ad; --line:#232e46;
    --primary:#6a90f7; --primary-ink:#0a1020; --primary-soft:#1b2848;
    --navy:#0b1530; --navy-2:#15264d; --ball:#d9f24b; --ball-ink:#1a2600;
    --good:#45c47f; --good-bg:#12301f; --bad:#f2735f; --bad-bg:#371b18; --info:#86a7ff; --info-bg:#1b2848;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1020; --surface:#121a2c; --surface-2:#18223a; --ink:#e9eef7; --ink-2:#c3cbd9; --muted:#8c98ad; --line:#232e46;
  --primary:#6a90f7; --primary-ink:#0a1020; --primary-soft:#1b2848;
  --navy:#0b1530; --navy-2:#15264d; --ball:#d9f24b; --ball-ink:#1a2600;
  --good:#45c47f; --good-bg:#12301f; --bad:#f2735f; --bad-bg:#371b18; --info:#86a7ff; --info-bg:#1b2848;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.num,table{font-variant-numeric:tabular-nums}

/* App-Leiste */
.appbar{background:linear-gradient(180deg,var(--navy),var(--navy-2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
.appbar-inner{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cd[hidden]{display:none}
@media (min-width:760px){.brand{flex:1}}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;flex:none;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.brand h1{font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:rgba(255,255,255,.68);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:12px}
.tab{background:none;border:0;color:rgba(255,255,255,.75);padding:7px 14px;font-weight:600;font-size:14px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab svg{width:18px;height:18px}
.tab[aria-current="page"]{background:#fff;color:var(--navy)}
.tab:focus-visible{outline:2px solid var(--ball);outline-offset:1px}
@media (max-width:759px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;border-radius:0;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(13,21,38,.06)}
  .tab{flex:1;flex-direction:column;gap:3px;padding:6px 4px;font-size:11px;color:var(--muted);border-radius:10px}
  .tab svg{width:22px;height:22px}
  .tab[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
  main{padding-bottom:calc(var(--nav-h) + 40px + env(safe-area-inset-bottom)) !important}
}

main{max-width:880px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:16px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{font-size:16px;margin-bottom:12px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h2{margin:0}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.page-head h2{font-size:22px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin:12px 0 0;line-height:1.5}
.notice{border-radius:12px;padding:12px 14px;background:var(--info-bg);color:var(--ink);font-size:14px}
.notice.bad{background:var(--bad-bg)}

/* Kopfkarte (Tabellenführer / Kasse) */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;border-radius:var(--r);padding:18px;display:grid;gap:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:22px solid rgba(217,242,75,.12)}
.hero .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.hero .big{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.hero .meta2{font-size:13.5px;color:rgba(255,255,255,.78);margin-top:2px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}
.crown{background:var(--ball);color:var(--ball-ink);font-weight:800;border-radius:12px;min-width:44px;height:44px;display:grid;place-items:center;font-size:18px;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.07);border-radius:12px;position:relative;z-index:1}
.stats>div{padding:10px 12px}
.stats>div+div{border-left:1px solid rgba(255,255,255,.1)}
.stats b{display:block;font-size:18px;font-weight:700}
.stats span{font-size:11.5px;color:rgba(255,255,255,.65)}
.podium{display:grid;gap:6px;position:relative;z-index:1}
.podium .p{display:flex;align-items:center;gap:10px;font-size:14px}
.podium .p i{font-style:normal;width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:12px;font-weight:700}
.podium .p .q{margin-left:auto;font-weight:700}

/* Tabellen */
.tablewrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%}
th,td{padding:11px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding-top:0}
th.l,td.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.click:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
td.pts{font-size:16px;font-weight:700}
.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--surface-2);font-weight:700;font-size:13px;color:var(--ink-2)}
tr.first .rank{background:var(--ball);color:var(--ball-ink)}
.pname{font-weight:600}
td.pname{white-space:normal;min-width:96px}
.chev{color:var(--muted);width:14px}
.form{display:inline-flex;gap:3px}
.fd{width:16px;height:16px;border-radius:5px;display:inline-grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff}
.fd.S{background:var(--good)} .fd.N{background:var(--bad)} .fd.U{background:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.show-m{display:none}
.subline{flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:4px;font-size:12px;font-weight:500;color:var(--muted)}
.divrow td{padding:16px 6px 6px;font-size:12px;color:var(--muted);white-space:normal;text-align:left;font-weight:500}
@media (max-width:600px){
  .hide-m{display:none}
  .show-m{display:flex}
  th,td{padding:11px 4px}
  .card{padding:16px 14px}
  .tablewrap{margin:0 -14px;padding:0 14px}
}

/* Buttons, Pills, Chips */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:0 14px;min-height:40px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:border-color .15s,background .15s}
.btn:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--line))}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn svg{width:16px;height:16px}
.tico svg{width:16px;height:16px}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions .btn{flex-direction:column;gap:3px;min-height:64px;font-size:12.5px;border-radius:14px;box-shadow:var(--shadow)}
.actions .btn svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.warn{background:#FFF4D6;color:#8A5A00}
.pill.ball{background:var(--ball);color:var(--ball-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.chip.paid[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.gtag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 5px;border-radius:5px;background:var(--surface-2);color:var(--muted);vertical-align:1px;margin-left:4px;border:1px solid var(--line)}
.chip .gtag{background:transparent;color:inherit;opacity:.75;border:0}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff}
.avatar.lg{width:56px;height:56px;font-size:20px}

/* Spieltage */
.md{display:grid;gap:12px}
.md-head{display:flex;gap:12px;align-items:center}
.datebox{width:52px;flex:none;border-radius:12px;background:var(--primary-soft);color:var(--primary);text-align:center;padding:6px 0;line-height:1.1}
.datebox b{display:block;font-size:20px;font-weight:800}
.datebox span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.md-title{flex:1;min-width:0}
.md-no{font-weight:700;font-size:16px}
.md-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rounds{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rnd{display:grid;grid-template-columns:30px 1fr;align-items:center;background:var(--surface)}
.rnd+.rnd{border-top:1px solid var(--line)}
.rl{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.03em}
.rnd.extra .rl{color:var(--primary)}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 12px 10px 4px;font-size:14px}
.match .ta{text-align:left;color:var(--muted)}.match .tb{text-align:right;color:var(--muted)}
.match .win{color:var(--ink);font-weight:700}
.score{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;text-align:center;white-space:nowrap}
.score small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.dayrank{display:flex;flex-wrap:wrap;gap:6px}
.dr{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;color:var(--ink-2)}
.dr b{font-weight:700}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.list{display:grid}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:first-child{padding-top:2px}
.li:last-child{border-bottom:0;padding-bottom:0}
.li .meta{font-size:12.5px;color:var(--muted)}
.li .who{display:flex;align-items:center;gap:11px;min-width:0}
.li .amt{text-align:right;display:grid;justify-items:end;gap:3px}
.amt-v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px}
.tico.pay{background:var(--good-bg);color:var(--good)} .tico.cost{background:var(--bad-bg);color:var(--bad)} .tico.tr{background:var(--info-bg);color:var(--info)}
.iconbtn{border:0;background:var(--surface-2);color:var(--ink-2);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--primary-soft);color:var(--primary)}
.iconbtn svg{width:18px;height:18px}

/* Spielerprofil */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:500}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,1fr)}}
.chart{width:100%;height:auto;display:block}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.fact .t{font-size:11.5px;color:var(--muted);font-weight:500}
.fact .v{font-weight:700;font-size:14px;margin-top:1px}
.sect{display:grid;gap:8px}
.sect h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.wl{font-weight:800;width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;font-size:11px;color:#fff;flex:none}
.wl.S{background:var(--good)}.wl.N{background:var(--bad)}.wl.U{background:var(--muted)}

/* Countdown & Abstimmung */
.cd{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:6px 12px;cursor:pointer;color:#fff;text-align:left;flex:none}
.cd .cd-l{font-size:11px;color:rgba(255,255,255,.65);font-weight:600;white-space:nowrap}
.cd .cd-v{font-size:14px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.cd.live{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
.cd.live .cd-l{color:var(--ball-ink);opacity:.75}
.cd .dot{width:8px;height:8px;border-radius:50%;background:var(--ball);flex:none}
.cd.live .dot{background:var(--ball-ink);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (max-width:759px){
  .appbar-inner{flex-wrap:wrap;row-gap:12px}
  .cd{order:3;width:100%;justify-content:flex-start;padding:9px 12px}
  .cd>span:last-child{display:flex;justify-content:space-between;align-items:baseline;flex:1;gap:10px}
  .cd .cd-v{display:inline !important}
}
.vote{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.vbtn[aria-pressed="true"].yes{background:var(--good);border-color:var(--good);color:#fff}
.vbtn[aria-pressed="true"].maybe{background:#c98a00;border-color:#c98a00;color:#fff}
.vbtn[aria-pressed="true"].no{background:var(--bad);border-color:var(--bad);color:#fff}
.vbtn:disabled{opacity:.45;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:1.5px dashed var(--line);border-radius:12px;min-height:66px;display:grid;place-items:center;align-content:center;gap:4px;padding:6px;font-size:12px;font-weight:600;text-align:center;color:var(--muted)}
.slot.on{border:1.5px solid var(--good);background:var(--good-bg);color:var(--ink)}
.slot .avatar{width:30px;height:30px;font-size:11px}
.vlist{display:grid;gap:6px;font-size:13.5px}
.vrow{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.vrow .k{width:84px;flex:none;font-size:12px;font-weight:600;color:var(--muted)}
.me{display:flex;align-items:center;gap:8px}
.me select{min-height:38px;padding:6px 10px;width:auto;flex:1;max-width:220px}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips .chip{padding:6px 11px;font-size:13px}
/* Alarmknopf für offene Aufgaben */
.alarm{position:fixed;right:16px;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:16;display:flex;align-items:center;gap:8px;
  background:var(--bad);color:#fff;border:0;border-radius:999px;padding:12px 18px 12px 14px;font-weight:700;font-size:14px;cursor:pointer;
  box-shadow:0 8px 24px rgba(210,58,42,.4)}
.alarm[hidden]{display:none}
.alarm .n{background:#fff;color:var(--bad);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
@media (prefers-reduced-motion:no-preference){.alarm{animation:ring 2.4s infinite}@keyframes ring{0%,100%{box-shadow:0 8px 24px rgba(210,58,42,.4),0 0 0 0 rgba(210,58,42,.45)}60%{box-shadow:0 8px 24px rgba(210,58,42,.4),0 0 0 14px rgba(210,58,42,0)}}}
@media (min-width:760px){.alarm{bottom:24px}}
.alarm{transition:padding .2s,gap .2s}
.alarm .al-t{transition:max-width .25s,opacity .2s;max-width:260px;overflow:hidden;white-space:nowrap}
body.scrolled .alarm{padding:10px 10px 10px 12px;gap:4px}
body.scrolled .alarm .al-t{max-width:0;opacity:0}
.has-alarm main{padding-bottom:calc(var(--nav-h) + 110px + env(safe-area-inset-bottom)) !important}
.resline{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:0 12px 10px 4px}
/* Aufklappbare Bereiche */
.acc-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:none;border:0;cursor:pointer;text-align:left}
.acc-head:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.acc-ico{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:18px;flex:none}
.acc-t{display:block;font-weight:700;font-size:15px}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getMessaging, getToken, isSupported as isMsgSupported, onMessage } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";
import { getFirestore, doc as fdoc, collection as fcol, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot as fsnap, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyClAD0L79joq8W7bQiMyb-uFIYK_IKBmhc",
  authDomain: "padel-liga-d9788.firebaseapp.com",
  projectId: "padel-liga-d9788",
  storageBucket: "padel-liga-d9788.firebasestorage.app",
  messagingSenderId: "465446473705",
  appId: "1:465446473705:web:d0ca6588a9fda78e968578"
};
const APP_VERSION = "2026-11-13.8";
const fbApp = initializeApp(firebaseConfig);
const fs = getFirestore(fbApp);
const auth = getAuth(fbApp);

/* Liga-Code: steht im Link (?liga=…) und wird auf dem Gerät gemerkt. Ohne Code keine Daten. */
const LIGA = (() => {
  let c = new URLSearchParams(location.search).get("liga");
  if(c && /^[A-Za-z0-9]{16,64}$/.test(c)){ try{ localStorage.setItem("padel-liga-code", c); }catch{} if(location.search.includes("v=")) history.replaceState(null, "", location.pathname + "?liga=" + c + location.hash); return c; }
  try{ c = localStorage.getItem("padel-liga-code"); }catch{ c = null; }
  if(c && /^[A-Za-z0-9]{16,64}$/.test(c)){ history.replaceState(null, "", location.pathname + "?liga=" + c + location.hash); return c; }
  return null;
})();
const BASE = LIGA ? "ligen/" + LIGA + "/" : "";
const shareLink = () => location.origin + location.pathname + "?liga=" + LIGA;

/* Kleine Hülle um Firestore, damit der Rest der App gleich bleibt */
const flat = (o, pre = "", out = {}) => { for(const [k,v] of Object.entries(o)){ const p = pre ? pre+"."+k : k; if(v && typeof v==="object" && !Array.isArray(v) && Object.keys(v).length) flat(v,p,out); else out[p] = v; } return out; };
const wrapDoc = s => ({id:s.id, exists:s.exists(), data:() => s.data(), metadata:s.metadata});
const docRef = r => ({ id:r.id, get:async () => wrapDoc(await getDoc(r)), set:d => setDoc(r,d), update:d => updateDoc(r, flat(d)), delete:() => deleteDoc(r), onSnapshot:(n,e) => fsnap(r, {includeMetadataChanges:true}, s => n(wrapDoc(s)), e) });
const colRef = path => { const c = fcol(fs, path); return { doc:id => docRef(id ? fdoc(c,id) : fdoc(c)), onSnapshot:(n,e) => fsnap(c, {includeMetadataChanges:true}, q => n({docs:q.docs.map(wrapDoc), metadata:q.metadata}), e) }; };
const DB = { doc: p => docRef(fdoc(fs,BASE+p)), collection: p => colRef(BASE+p) };
async function importAll(obj){
  const b = writeBatch(fs); let n = 0;
  if(obj.config){ b.set(fdoc(fs,BASE+"league/config"), obj.config); n++; }
  for(const m of (obj.matchdays||[])){ const {id, ...rest} = m; if(id){ b.set(fdoc(fs,BASE+"matchdays/"+id), rest); n++; } }
  for(const e of (obj.ledger||[])){ const {id, ...rest} = e; if(id){ b.set(fdoc(fs,BASE+"ledger/"+id), rest); n++; } }
  await b.commit(); return n;
}

const S = { broadcasts:[], votes:[], rides:[], doorcodes:{}, avatars:{}, comments:[], pinpays:[], cmOpen:new Set(), surveys:[], svotes:[], tsub:"me", mdRaw:[], results:{},
  db:null, noDb:false, authUser:null, authChecked:false, denied:false, unsubs:[], readOnly:false, slow:false,
  config:null, matchdays:[], ledger:[],
  loaded:{config:false, md:false, lg:false},
  view:"home", modal:null, draft:null, armed:null
};
const VIEWS = ["home","tabelle","spieltage","kasse","einstellungen"];
const eur = new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const r2 = x => Math.round(x*100)/100;
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const players = () => Array.isArray(S.config?.players) ? S.config.players : [];
const guests = () => Array.isArray(S.config?.guests) ? S.config.guests : [];
const draftGuests = () => Array.isArray(S.draft?.newGuests) ? S.draft.newGuests : [];
const isGuest = id => guests().some(g => g.id === id) || draftGuests().some(g => g.id === id);
const pname = id => players().find(p => p.id === id)?.name || guests().find(g => g.id === id)?.name || draftGuests().find(g => g.id === id)?.name || "Ehemalig";
const guestObj = id => guests().find(g => g.id === id) || draftGuests().find(g => g.id === id);
const hostOf = id => { const h = guestObj(id)?.host; return h && players().some(p => p.id === h) ? h : null; };
const payerOf = id => hostOf(id) || id;
/* Gäste, die selbst zahlen, geben ihr Geld an diesen Spieler (z. B. wer vorgestreckt hat) */
const cashier = () => { const c = S.config?.guestCashier; return c && players().some(p => p.id === c) ? c : null; };
const paysCashier = id => isGuest(id) && !hostOf(id) && !!cashier();
const gtag = id => isGuest(id) ? `<span class="gtag">Gast${hostOf(id) ? " · über "+esc(pname(hostOf(id))) : ""}</span>` : "";
const hostOpts = sel => `<option value="">zahlt selbst</option>` + players().map(p => `<option value="${esc(p.id)}" ${p.id===sel?"selected":""}>übernimmt ${esc(p.name)}</option>`).join("");
const nameHtml = id => esc(pname(id)) + gtag(id);
const fmtDate = (d, long) => { if(!d) return "Ohne Datum"; const x = new Date(d+"T12:00:00"); return isNaN(x) ? d : x.toLocaleDateString("de-DE", long ? {weekday:"long",day:"numeric",month:"long",year:"numeric"} : {day:"2-digit",month:"2-digit",year:"numeric"}); };
const byDate = (a,b) => (a.date||"").localeCompare(b.date||"") || (a.createdAt||0)-(b.createdAt||0);
const canWrite = () => !!S.db && !S.readOnly;
const $ = id => document.getElementById(id);

/* ---------- Berechnungen ---------- */
function result(m){
  if(m.status==="proposed") return {sa:0,sb:0,ga:0,gb:0,w:"d",played:false};
  let sa=0,sb=0,ga=0,gb=0,n=0;
  for(const s of (m.sets||[])){
    const a = Number(s?.a), b = Number(s?.b);
    if(!(a>=0 && b>=0) || s?.a==null || s?.b==null) continue;
    n++; ga+=a; gb+=b;
    if(a>b) sa++; else if(b>a) sb++;
  }
  const w = sa>sb ? "a" : sb>sa ? "b" : ga>gb ? "a" : gb>ga ? "b" : "d";
  return {sa,sb,ga,gb,w,played:n>0};
}
function mdNumbers(){
  const map = {}; [...S.matchdays].sort(byDate).forEach((m,i)=>map[m.id]=i+1); return map;
}
const minPct = () => { const v = S.config?.minPct; return v==null || v==="" ? 50 : Math.max(0, Math.min(100, num(v))); };
const playedDays = () => S.matchdays.filter(md => (md.matches||[]).some(m => result(m).played)).length;
const minDays = () => Math.ceil(playedDays() * minPct() / 100);
/* Einzelwertung eines Spieltags: Siege, dann Spieldifferenz */
function dayRanking(md){
  const t = {};
  (md.participants||[]).forEach(id => t[id] = {id, sp:0, s:0, u:0, gd:0});
  for(const m of (md.matches||[])){
    const r = result(m); if(!r.played) continue;
    for(const [ids,side,mg,tg] of [[m.a,"a",r.ga,r.gb],[m.b,"b",r.gb,r.ga]]){
      for(const id of (ids||[])){
        const x = t[id] ||= {id, sp:0, s:0, u:0, gd:0};
        x.sp++; x.gd += mg-tg;
        if(r.w==="d") x.u++; else if(r.w===side) x.s++;
      }
    }
  }
  const rows = Object.values(t).sort((a,b) => (b.s+b.u/2)-(a.s+a.u/2) || b.gd-a.gd || pname(a.id).localeCompare(pname(b.id)));
  const top = rows[0]; const winners = top && top.sp ? rows.filter(x => x.s+x.u/2===top.s+top.u/2 && x.gd===top.gd).map(x=>x.id) : [];
  return {rows, winners};
}
function standings(pool){
  const t = {};
  (pool || players()).forEach(p => t[p.id] = {id:p.id,sp:0,s:0,u:0,n:0,gw:0,gl:0,days:0,dayWins:0,form:[]});
  for(const md of [...S.matchdays].sort(byDate)){
    const any = (md.matches||[]).some(m => result(m).played);
    if(any) (md.participants||[]).forEach(id => t[id] && t[id].days++);
    dayRanking(md).winners.forEach(id => t[id] && t[id].dayWins++);
    for(const m of (md.matches||[])){
      const r = result(m); if(!r.played) continue;
      for(const [ids,side,mg,tg] of [[m.a,"a",r.ga,r.gb],[m.b,"b",r.gb,r.ga]]){
        for(const id of (ids||[])){
          const x = t[id]; if(!x) continue;
          x.sp++; x.gw+=mg; x.gl+=tg;
          if(r.w==="d"){ x.u++; x.form.push("U"); }
          else if(r.w===side){ x.s++; x.form.push("S"); }
          else { x.n++; x.form.push("N"); }
        }
      }
    }
  }
  const need = minDays();
  const rows = Object.values(t).map(x => ({...x, quote: x.sp ? (x.s + x.u/2)/x.sp : 0, gdpm: x.sp ? (x.gw-x.gl)/x.sp : 0, ok: x.sp>0 && x.days >= need}));
  return rows.sort((a,b) => (b.ok-a.ok) || b.quote-a.quote || b.gdpm-a.gdpm || b.s-a.s || b.sp-a.sp || pname(a.id).localeCompare(pname(b.id)));
}
function pairStats(){
  const map = {};
  for(const md of S.matchdays) for(const m of (md.matches||[])){
    const r = result(m); if(!r.played) continue;
    for(const [ids,side] of [[m.a,"a"],[m.b,"b"]]){
      if(!ids || ids.length!==2 || ids.some(isGuest)) continue;
      const k = [...ids].sort().join("+");
      map[k] ||= {ids:[...ids].sort(), sp:0, s:0};
      map[k].sp++; if(r.w===side) map[k].s++;
    }
  }
  return Object.values(map).sort((a,b) => b.s/b.sp - a.s/a.sp || b.sp-a.sp);
}
function finance(){
  const f = {}; [...players(), ...guests()].forEach(p => f[p.id] = {id:p.id, owed:0, paid:0});
  let total=0, paidTotal=0; const unpaid = []; const outside = [];
  for(const md of [...S.matchdays].sort(byDate)){
    const cost = num(md.courtCost);
    const parts = (md.participants||[]).filter(id => f[id]);
    if(md.outside){
      // Spieltag außerhalb des Abos: Kosten zählen zu den Gesamtkosten, nicht zu Daniels Vorschuss
      if(cost>0 && parts.length){
        total += cost; const sh = cost/parts.length;
        outside.push({md, cost, share:sh, paidBy: md.outsidePaidBy || "self", parts});
        if(md.outsidePaidBy && md.outsidePaidBy!=="self" && f[md.outsidePaidBy]){
          parts.forEach(id => { const who = f[payerOf(id)] ? payerOf(id) : id; f[who].owed += sh; });
          f[md.outsidePaidBy].paid += cost;
        }
      }
      continue;
    }
    if(cost>0 && parts.length){
      total += cost; const sh = cost/parts.length;
      for(const id of parts){
        const who = f[payerOf(id)] ? payerOf(id) : id;
        f[who].owed += sh;
        if(md.paid?.[id]){ f[who].paid += sh; if(paysCashier(id)) f[cashier()].paid -= sh; else paidTotal += sh; } else unpaid.push({md, id, who, sh});
      }
    }
  }
  for(const e of S.ledger){
    if(e.status==="pending" || e.status==="deleted") continue;
    const amt = num(e.amount);
    if(e.type==="cost"){
      const ps = (e.players||[]).filter(id => f[id]);
      if(!ps.length) continue;
      total += amt; ps.forEach(id => f[id].owed += amt/ps.length);
    } else if(e.type==="payment" && f[e.playerId]){
      f[e.playerId].paid += amt; if(paysCashier(e.playerId)) f[cashier()].paid -= amt; else paidTotal += amt;
    } else if(e.type==="transfer" && f[e.from] && f[e.to]){
      f[e.from].paid += amt; f[e.to].paid -= amt;
    }
  }
  const all = Object.values(f).map(x => ({...x, bal: r2(x.paid - x.owed)}));
  /* Offene Anteile mit Guthaben verrechnen: Was das Konto deckt, gilt als bezahlt (älteste zuerst).
     Offen bleiben nur die jüngsten Anteile in Höhe des Minusbetrags. */
  const balOf = {}; all.forEach(x => balOf[x.id] = x.bal);
  const left = {}; const covered = new Set(); const openMap = new Map();
  for(const u of [...unpaid].reverse()){
    left[u.who] ??= Math.max(0, -(balOf[u.who]||0));
    if(left[u.who] > 0.004){ left[u.who] -= u.sh; if(!openMap.has(u.md)) openMap.set(u.md, {md:u.md, share:u.sh, open:[]}); openMap.get(u.md).open.push(u.id); }
    else covered.add(u.md.id+"|"+u.id);
  }
  const openMd = [...openMap.values()].sort((a,b)=>byDate(a.md,b.md));
  const open = all.reduce((s,x) => s + Math.max(0, -x.bal), 0);
  const rows = all.filter(x => !isGuest(x.id));
  const guestRows = all.filter(x => isGuest(x.id) && (x.owed>0 || x.paid>0));
  return {rows, guestRows, total:r2(total), paidTotal:r2(paidTotal), open:r2(open), openMd, covered, outside};
}
function balPill(b){
  if(Math.abs(b) < 0.005) return `<span class="pill good">Ausgeglichen</span>`;
  if(b < 0) return `<span class="pill bad num">Offen ${eur.format(-b)}</span>`;
  return `<span class="pill info num">Guthaben ${eur.format(b)}</span>`;
}

/* ---------- Spielzeiten & Countdown ---------- */
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const sched = () => {
  const c = S.config || {};
  const days = Array.isArray(c.playDays) && c.playDays.length ? c.playDays : [2,4];
  const ok = t => /^\d{1,2}:\d{2}$/.test(t||"");
  return {days, start: ok(c.startTime) ? c.startTime : "19:30", end: ok(c.endTime) ? c.endTime : "21:00"};
};
const atTime = (d, hm) => { const [h,m] = hm.split(":").map(Number); const x = new Date(d); x.setHours(h,m,0,0); return x; };
const isoDay = d => { const x = new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
/* Nächster Termin, der noch nicht vorbei ist (läuft er gerade, ist es dieser) */
function nextSession(now = new Date()){
  const sc = sched();
  for(let i=0;i<15;i++){
    const d = new Date(now); d.setDate(d.getDate()+i);
    if(!sc.days.includes(d.getDay())) continue;
    const start = atTime(d, sc.start), end = atTime(d, sc.end);
    if(end <= start) end.setDate(end.getDate()+1);
    if(now < end) return {start, end, live: now >= start, key: isoDay(start)};
  }
  return null;
}
const fmtSession = ns => `${WD[ns.start.getDay()]}, ${ns.start.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}`;
function countdownText(ns, now = new Date()){
  if(ns.live){ const m = Math.max(0, Math.round((ns.end-now)/60000)); return `noch ${m>=60 ? Math.floor(m/60)+" Std "+(m%60)+" Min" : m+" Min"}`; }
  let m = Math.max(0, Math.round((ns.start-now)/60000));
  const d = Math.floor(m/1440); m -= d*1440; const h = Math.floor(m/60); m -= h*60;
  return "in " + (d ? `${d} T ${h} Std` : h ? `${h} Std ${m} Min` : `${m} Min`);
}
let lastKey = null;

  el.hidden = false; el.classList.toggle("live", ns.live);

  if(lastKey !== ns.key + ns.live){ const first = lastKey===null; lastKey = ns.key + ns.live; if(!first && !S.modal) render(); }
}

async function noteMoveUp(key, outId){

  const ok = id => players().some(p=>p.id===id) || guests().some(g=>g.id===id);
  const vs = S.votes.filter(v => v.key===key && ok(v.pid));
  const by = s => vs.filter(v=>v.s===s).sort((a,b)=>(a.t||0)-(b.t||0)).map(v=>v.pid);
  const yes = by("yes");
  return {yes, play: yes.slice(0,4), wait: yes.slice(4), maybe: by("maybe"), no: by("no"),
    open: players().map(p=>p.id).filter(id => !vs.some(v=>v.pid===id)), mine: id => vs.find(v=>v.pid===id)?.s || null,
    by: id => vs.find(v=>v.pid===id)?.by || null};
}
/* Gleiche Auslosung für Vorschau und automatisch angelegten Spieltag: Zufall mit dem Datum als Startwert */
function seededOrder(ids, key){
  let h = 2166136261; for(const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => { h = (h + 0x6D2B79F5) >>> 0; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const a = [...ids].sort(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a;
}

/* ---------- Ergebnisse mit Bestätigung ----------
   Ergebnisse liegen in "results" (ein Dokument pro Runde: <spieltag>__<runde>).
   Status "proposed": von einem Team eingetragen, zählt noch nicht. "confirmed": vom anderen Team bestätigt, danach gesperrt.
   Alte Ergebnisse direkt im Spieltag (ohne Status) gelten als bestätigt. */
const resKey = (mdId, mId) => mdId + "__" + mId;
function mergeResults(){
  S.matchdays = S.mdRaw.map(md => ({...md, matches:(md.matches||[]).map(m => {
    const r = S.results[resKey(md.id, m.id)];
    if(r) return {...m, sets:r.sets||[], status:r.status, res:r};
    const legacy = (m.sets||[]).some(s => s?.a!=null && s?.b!=null);
    return {...m, status: legacy ? "confirmed" : null, legacy};
  })}));
}
const deviceOf = pid => S.members.some(x => x.pid===pid && isActive(x));
/* Wer darf bestätigen? Das andere Team; hat davon niemand ein freigegebenes Gerät, jeder Liga-Spieler außerhalb des eintragenden Teams */
function confirmersFor(m){
  const r = m.res; if(!r) return [];
  if(r.side!=="a" && r.side!=="b") return players().map(p=>p.id).filter(id => id!==r.by && deviceOf(id));
  const own = r.side==="a" ? (m.a||[]) : (m.b||[]); const other = r.side==="a" ? (m.b||[]) : (m.a||[]);
  const withDev = other.filter(deviceOf);
  return withDev.length ? withDev : players().map(p=>p.id).filter(id => !own.includes(id) && deviceOf(id));
}
function resRole(m){
  const me = getMe(); if(!me || !canWrite()) return null;
  if(m.status==="confirmed") return "locked";
  if(m.status==="proposed"){
    const own = m.res.side==="a" ? (m.a||[]) : m.res.side==="b" ? (m.b||[]) : [];
    if(own.includes(me) || m.res.by===me) return "waiting";
    if(confirmersFor(m).includes(me)) return "confirm";
    return null;
  }
  if((m.a||[]).includes(me) || (m.b||[]).includes(me)) return "enter";
  // niemand aus dem Match hat ein Gerät: dann darf jeder Liga-Spieler eintragen
  if(![...(m.a||[]),...(m.b||[])].some(deviceOf) && players().some(p=>p.id===me)) return "enter";
  return null;
}
function resActions(md, m){
  const role = resRole(m); const r = m.res;
  const btn = (act, label, cls="") => `<button class="btn sm ${cls}" data-act="${act}" data-md="${esc(md.id)}" data-mid="${esc(m.id)}">${label}</button>`;
  if(m.status==="confirmed") return `<div class="resline"><span class="small muted">🔒 ${m.legacy ? "Ergebnis eingetragen" : `bestätigt von ${esc(pname(r?.confirmedBy))}`}</span></div>`;
  if(m.status==="proposed") return `<div class="resline"><span class="small" style="color:var(--warn,#B7791F)">⏳ eingetragen von ${esc(pname(r.by))}, wartet auf Bestätigung durch das andere Team</span>
    ${role==="confirm" ? `<div class="row">${btn("res-ok","Bestätigen ✓","primary")}${btn("res-no","Ablehnen","danger")}</div>` : role==="waiting" ? `<div class="row">${btn("res-no","Zurückziehen","ghost")}</div>` : ""}</div>`;
  if(role==="enter" && md.date && md.date <= today()) return `<div class="resline">${btn("res-enter","Ergebnis eintragen","primary")}</div>`;
  return "";
}
function pendingResultsForMe(){
  const out = [];
  for(const md of S.matchdays) (md.matches||[]).forEach((m,i) => { if(m.status==="proposed" && resRole(m)==="confirm") out.push({md, m, i}); });
  return out;
}

/* Spieltag aus der Abstimmung anlegen (beim Spielbeginn automatisch, oder per Knopf) */
const autoBusy = new Set();
async function createFromPoll(key){
  if(!canWrite() || autoBusy.has(key) || mdForDate(key)) return false;
  const P = pollFor(key); if(P.play.length < 4) return false;
  autoBusy.add(key);
  try{
    const ref = S.db.doc("matchdays/auto-"+key);
    const snap = await ref.get(); if(snap.exists) return false;
    const play = P.play.slice(0,4);
    const body = {date:key, location:S.config?.defaultLocation||"", courtCost:r2(num(S.config?.defaultCost)), participants:play,
      matches: plannedRounds(play, key).map(m => ({id:m.id, extra:false, a:m.a, b:m.b, sets:[]})), paid:{}, note:"", auto:true, createdAt:Date.now(), updatedAt:Date.now()};
    return await write(() => ref.set(body));
  } finally { autoBusy.delete(key); }
}
function lastSessionKeys(now = new Date()){
  // laufender Termin und Termine der letzten 8 Tage, die schon begonnen haben
  const sc = sched(); const keys = [];
  for(let i=0;i<=8;i++){
    const d = new Date(now); d.setDate(d.getDate()-i);
    if(!sc.days.includes(d.getDay())) continue;
    if(atTime(d, sc.start) <= now) keys.push(isoDay(d));
  }
  return keys;
}
function autoCreate(){
  if(!S.config || !allFresh() || !canWrite()) return;
  for(const key of lastSessionKeys()) if(!mdForDate(key) && pollFor(key).play.length>=4) createFromPoll(key);
}
function allFresh(){ return fresh.config && fresh.md && fresh.lg; }

/* ---------- Spieltag-Karte (Ticket mit Statistik-Kacheln) ---------- */
function funTiles(key, play){
  const T = []; const E = eloC(); const nm = id => esc(pname(id));
  const ps = play.map(id => ({id, P: playerStats(id)}));
  const hot = ps.filter(x => x.P.curType==="S" && x.P.curLen>=2).sort((a,b)=>b.P.curLen-a.P.curLen)[0];
  if(hot) T.push({n: hot.P.curLen, u:"Siege in Folge", who: nm(hot.id), q:"Wer stoppt den Lauf? 🔥", w:9});
  const cold = ps.filter(x => x.P.curType==="N" && x.P.curLen>=2).sort((a,b)=>b.P.curLen-a.P.curLen)[0];
  if(cold) T.push({n: cold.P.curLen, u:"Niederlagen in Folge", who: nm(cold.id), q:"Heute dreht sich das 🧊", w:7});
  let best=null;
  for(let i=0;i<play.length;i++) for(let j=i+1;j<play.length;j++){ const c = compareStats(play[i], play[j]); if(c.vs.sp>=2 && (!best || c.vs.sp>best.c.vs.sp)) best = {a:play[i], b:play[j], c}; }
  if(best){ const v=best.c.vs; T.push({n:`${v.a}:${v.b}`, u:"im direkten Duell", who:`${nm(best.a)} vs. ${nm(best.b)}`, q: v.a===v.b ? "Alles offen 🥊" : "Revanche fällig? 🥊", w:8}); }
  if(play.length>=4){
    const r = plannedRounds(play.slice(0,4), key).map((m,i)=>({i,wp:winProb(m)})).filter(x=>x.wp!=null).sort((a,b)=>Math.abs(a.wp-50)-Math.abs(b.wp-50))[0];
    if(r) T.push({n:`${r.wp}%`, u:`Siegchance Runde ${r.i+1}`, who:"laut Elo", q:"Das wird ein Krimi ⚖️", w:6});
  }
  let duo=null;
  for(let i=0;i<play.length;i++) for(let j=i+1;j<play.length;j++){ const t = compareStats(play[i], play[j]).tog; if(t.sp>=2 && t.s/t.sp>=.75 && (!duo || t.s>duo.t.s)) duo = {a:play[i], b:play[j], t}; }
  if(duo) T.push({n:`${duo.t.s}/${duo.t.sp}`, u:"Siege als Team", who:`${nm(duo.a)} & ${nm(duo.b)}`, q:"Traumduo am Start 🤝", w:7});
  const fav = [...play].filter(id => E.R[id]!=null).sort((a,b)=>E.rating(b)-E.rating(a))[0];
  if(fav) T.push({n: E.rating(fav), u:"Elo-Punkte", who: nm(fav), q:"Heutiger Favorit 👑", w:5});
  play.filter(isGuest).forEach(g => { const n = playerStats(g).list.length; T.push({n: n+1, u: n ? "Match als Gast" : "erstes Match", who: nm(g), q: n ? "Willkommen zurück 👋" : "Premiere! 👋", w:6}); });
  const dw = ps.filter(x => x.P.dayWins>0).sort((a,b)=>b.P.dayWins-a.P.dayWins)[0];
  if(dw) T.push({n: dw.P.dayWins, u: dw.P.dayWins===1?"Tagessieg":"Tagessiege", who: nm(dw.id), q:"Kommt heute einer dazu? 🏆", w:4});
  const order = seededOrder(T.map((_,i)=>String(i)), key+"tiles").map(Number);
  return T.map((t,i)=>({t, r:order.indexOf(i)})).sort((a,b)=>b.t.w-a.t.w || a.r-b.r).slice(0,4).map(x=>x.t);
}

function rideState(key, play){
  const R = S.rides.filter(r => r.key===key && play.includes(r.pid));
  const mode = pid => R.find(r => r.pid===pid);
  const drivers = play.filter(p => mode(p)?.mode==="drive");
  const ridersOf = d => play.filter(p => mode(p)?.mode==="ride" && mode(p).with===d);
  const need = play.filter(p => mode(p)?.mode==="need" || (mode(p)?.mode==="ride" && !drivers.includes(mode(p).with)));
  const solo = play.filter(p => mode(p)?.mode==="solo");
  return {mode, drivers, ridersOf, need, solo};
}

async function ppLoad(file){
  const d = S.draft; if(!file || !d) return;
  d.busy = true; renderModal();
  try{
    const url = URL.createObjectURL(file);
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    const size = 320, c = document.createElement("canvas"); c.width = c.height = size;
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    c.getContext("2d").drawImage(img, (img.naturalWidth-s)/2, (img.naturalHeight-s)/2, s, s, 0, 0, size, size);
    URL.revokeObjectURL(url);
    let q = .82, out = c.toDataURL("image/jpeg", q);
    while(out.length > 90000 && q > .4){ q -= .1; out = c.toDataURL("image/jpeg", q); }
    if(S.draft===d) d.img = out;

}

function calEvent(key){

  const rounds = md ? (md.matches||[]) : (play.length>=4 ? plannedRounds(play.slice(0,4), key) : []);
  const loc = (md?.location || S.config?.defaultLocation || "").trim();

/* ---------- Elo-Spielstärke ----------
   Start 1000. Teamstärke = Mittel der beiden Spieler. Erwartung nach Elo-Formel,
   K = 32, deutliche Ergebnisse zählen bis zu 50 % mehr. Beide Spieler eines Teams bekommen dieselbe Änderung. */
const ELO_START = 1000;
function elo(){
  const R = {}, peak = {}, hist = {};
  const get = id => (R[id] ??= ELO_START);
  for(const md of [...S.matchdays].sort(byDate)){
    let any = false;
    for(const m of (md.matches||[])){
      const r = result(m); if(!r.played) continue;
      const a = (m.a||[]).filter(Boolean), b = (m.b||[]).filter(Boolean); if(a.length!==2 || b.length!==2) continue;
      const ra = (get(a[0])+get(a[1]))/2, rb = (get(b[0])+get(b[1]))/2;
      const E = 1/(1+Math.pow(10,(rb-ra)/400)); const Sa = r.w==="a" ? 1 : r.w==="b" ? 0 : .5;
      const k = 32*(1 + Math.min(Math.abs(r.ga-r.gb),6)/12); const d = k*(Sa-E);
      a.forEach(id => R[id] += d); b.forEach(id => R[id] -= d);
      [...a,...b].forEach(id => peak[id] = Math.max(peak[id] ?? ELO_START, R[id]));
      any = true;
    }
    if(any) (md.participants||[]).forEach(id => { if(R[id]!=null) (hist[id] ||= []).push({md, r:R[id]}); });
  }
  const rating = id => Math.round(R[id] ?? ELO_START);
  const trend = id => { const h = hist[id]||[]; if(!h.length) return 0; const last = h[h.length-1]; const prev = h.length>1 ? h[h.length-2].r : ELO_START; return Math.round(last.r - prev); };
  return {R, rating, trend, peak: id => Math.round(peak[id] ?? ELO_START), hist};
}
function eloC(){ return S._elo ||= elo(); }
function winProb(m){
  const a = (m.a||[]).filter(Boolean), b = (m.b||[]).filter(Boolean); if(a.length!==2 || b.length!==2) return null;
  const E = eloC(); const r = id => E.R[id] ?? ELO_START;
  const pa = 1/(1+Math.pow(10, ((r(b[0])+r(b[1]))/2 - (r(a[0])+r(a[1]))/2)/400));
  return Math.round(pa*100);
}
function eloCard(){
  const E = eloC(); const ps = players().filter(p => E.R[p.id]!=null);
  if(!ps.length) return "";
  const rows = ps.map(p => ({id:p.id, r:E.rating(p.id), t:E.trend(p.id)})).sort((a,b)=>b.r-a.r);
  const lo = Math.min(...rows.map(x=>x.r)), hi = Math.max(...rows.map(x=>x.r)); const span = Math.max(hi-lo, 1);
  return `<section class="card">
    <div class="card-head"><h2>Spielstärke (Elo)</h2><button class="btn ghost sm" data-act="compare" id="btnCompare">Direktvergleich</button></div>
    <div class="list">${rows.map((x,i) => `<div class="li click" data-act="player" data-id="${esc(x.id)}" tabindex="0" style="cursor:pointer">
      <div class="who" style="flex:1"><span class="rank" style="${i===0?"background:var(--ball);color:var(--ball-ink)":""}">${i+1}</span><div style="flex:1;min-width:0"><div class="pname">${esc(pname(x.id))}</div>
        <div style="height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden"><div style="height:100%;width:${Math.round(20+80*(x.r-lo)/span)}%;background:var(--primary);border-radius:3px"></div></div></div></div>
      <div class="amt"><span class="amt-v">${x.r}</span><span class="small ${x.t>0?"pos":x.t<0?"neg":"muted"}" style="font-weight:600">${x.t>0?"▲ +"+x.t:x.t<0?"▼ "+x.t:"±0"}</span></div></div>`).join("")}</div>
    <p class="note">Alle starten bei ${ELO_START}. Ein Sieg gegen ein stärkeres Team bringt mehr Punkte als gegen ein schwächeres, deutliche Ergebnisse zählen etwas mehr. Der Pfeil zeigt die Änderung am letzten Spieltag.</p>
  </section>`;
}

/* ---------- Direktvergleich ---------- */
function compareStats(a, b){
  const vs = {sp:0, a:0, b:0, d:0, ga:0, gb:0, list:[]}, tog = {sp:0, s:0, gd:0};
  for(const md of [...S.matchdays].sort(byDate)) (md.matches||[]).forEach((m,i) => {
    const r = result(m); if(!r.played) return;
    const sa = (m.a||[]).includes(a) ? "a" : (m.b||[]).includes(a) ? "b" : null;
    const sb = (m.a||[]).includes(b) ? "a" : (m.b||[]).includes(b) ? "b" : null;
    if(!sa || !sb) return;
    const g = s => s==="a" ? [r.ga, r.gb] : [r.gb, r.ga];
    if(sa===sb){ tog.sp++; if(r.w===sa) tog.s++; else if(r.w==="d") tog.s += .5; tog.gd += g(sa)[0]-g(sa)[1]; }
    else { vs.sp++; if(r.w===sa) vs.a++; else if(r.w===sb) vs.b++; else vs.d++; vs.ga += g(sa)[0]; vs.gb += g(sa)[1]; vs.list.push({md, m, i, sa, r}); }
  });
  return {vs, tog};
}

function playerStats(id){
  const list = [];
  for(const md of [...S.matchdays].sort(byDate)){
    (md.matches||[]).forEach((m,i) => {
      const r = result(m); if(!r.played) return;
      const side = (m.a||[]).includes(id) ? "a" : (m.b||[]).includes(id) ? "b" : null; if(!side) return;
      const mine = side==="a" ? m.a : m.b, theirs = side==="a" ? m.b : m.a;
      const mg = side==="a" ? r.ga : r.gb, tg = side==="a" ? r.gb : r.ga;
      const res = r.w==="d" ? "U" : r.w===side ? "S" : "N";
      const sets = (m.sets||[]).filter(s=>s?.a!=null&&s?.b!=null).map(s => side==="a" ? [s.a,s.b] : [s.b,s.a]);
      list.push({md, i, m, res, mg, tg, partner: mine.find(x=>x!==id), opps: theirs, sets});
    });
  }
  const days = S.matchdays.filter(md => (md.participants||[]).includes(id) && (md.matches||[]).some(m=>result(m).played));
  const wins = list.filter(x=>x.res==="S").length, losses = list.filter(x=>x.res==="N").length, draws = list.filter(x=>x.res==="U").length;
  const gw = list.reduce((s,x)=>s+x.mg,0), gl = list.reduce((s,x)=>s+x.tg,0);
  let best = 0, cur = 0; for(const x of list){ if(x.res==="S"){ cur++; best = Math.max(best,cur); } else cur = 0; }
  let curType = list.length ? list[list.length-1].res : null, curLen = 0;
  for(let k=list.length-1;k>=0 && list[k].res===curType;k--) curLen++;
  const close = list.filter(x => x.sets.length===1 && (Math.abs(x.mg-x.tg)<=2 || Math.max(x.mg,x.tg)>=7));
  const closeW = close.filter(x=>x.res==="S").length;
  const bigWin = list.filter(x=>x.res==="S").sort((a,b)=>(b.mg-b.tg)-(a.mg-a.tg))[0];
  const bigLoss = list.filter(x=>x.res==="N").sort((a,b)=>(a.mg-a.tg)-(b.mg-b.tg))[0];
  const agg = (keyFn) => { const o = {}; for(const x of list) for(const k of [].concat(keyFn(x))){ if(!k) continue; o[k] ||= {id:k, sp:0, s:0, gd:0}; o[k].sp++; if(x.res==="S") o[k].s++; else if(x.res==="U") o[k].s += .5; o[k].gd += x.mg-x.tg; } return Object.values(o).sort((a,b)=>b.s/b.sp-a.s/a.sp || b.gd-a.gd || b.sp-a.sp); };
  const partners = agg(x=>x.partner), opps = agg(x=>x.opps);
  // Verlauf: Siegquote nach jedem Spieltag
  const timeline = []; let w=0, n=0;
  for(const md of [...S.matchdays].sort(byDate)){
    const xs = list.filter(x=>x.md===md); if(!xs.length) continue;
    xs.forEach(x => { n++; if(x.res==="S") w++; else if(x.res==="U") w += .5; });
    timeline.push({md, q: w/n});
  }
  const dayWins = S.matchdays.filter(md => dayRanking(md).winners.includes(id)).length;
  return {list, days:days.length, wins, losses, draws, gw, gl, best, curType, curLen, close:close.length, closeW, bigWin, bigLoss, partners, opps, timeline, dayWins};
}
function eloChartSvg(id){
  const h = (eloC().hist[id]||[]); if(h.length < 1) return `<div class="muted small">Noch keine Daten.</div>`;
  const tl = [{md:null, r:ELO_START}, ...h];
  const vals = tl.map(t=>t.r); let lo = Math.min(...vals, ELO_START), hi = Math.max(...vals, ELO_START);
  const padv = Math.max(10, (hi-lo)*.15); lo = Math.floor((lo-padv)/10)*10; hi = Math.ceil((hi+padv)/10)*10;
  const W=320, H=150, L=40, R=14, T=12, B=24, iw=W-L-R, ih=H-T-B;
  const X = i => L + i*iw/(tl.length-1), Y = v => T + (1-(v-lo)/(hi-lo))*ih;
  const pts = tl.map((t,i)=>[X(i),Y(t.r)]);
  const line = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const nums = mdNumbers(); const step = Math.ceil(tl.length/6); const last = pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Elo-Verlauf">
    ${[hi, ELO_START, lo].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${v===ELO_START?'stroke-dasharray="3 3"':""}/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`).join("")}
    <path d="${line}" fill="none" stroke="#0e8a7e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:2.5}" fill="${i===pts.length-1?"#0e8a7e":"var(--surface)"}" stroke="#0e8a7e" stroke-width="1.8"/>`).join("")}
    ${tl.map((t,i)=> (i%step===0 || i===tl.length-1) ? `<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${t.md ? "ST "+nums[t.md.id] : "Start"}</text>` : "").join("")}
    <text x="${Math.min(last[0], W-R-2)}" y="${Math.max(last[1]-9, 10)}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">${Math.round(tl[tl.length-1].r)}</text>
  </svg>`;
}
function chartSvg(tl){
  if(tl.length < 2) return `<div class="muted small">Der Verlauf erscheint ab dem zweiten Spieltag.</div>`;
  const W=320, H=150, L=34, R=14, T=12, B=24, iw=W-L-R, ih=H-T-B;
  const X = i => L + (tl.length===1 ? iw/2 : i*iw/(tl.length-1)), Y = q => T + (1-q)*ih;
  const pts = tl.map((t,i)=>[X(i),Y(t.q)]);
  const line = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)} ${Y(0)} L${pts[0][0].toFixed(1)} ${Y(0)} Z`;
  const last = pts[pts.length-1], lq = tl[tl.length-1].q;
  const nums = mdNumbers();
  const step = Math.ceil(tl.length/6);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf der Siegquote">
    ${[0,.5,1].map(q=>`<line x1="${L}" x2="${W-R}" y1="${Y(q)}" y2="${Y(q)}" stroke="var(--line)" ${q===.5?'stroke-dasharray="3 3"':""}/><text x="${L-6}" y="${Y(q)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${q*100} %</text>`).join("")}
    <path d="${area}" fill="var(--primary)" opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:2.5}" fill="${i===pts.length-1?"var(--primary)":"var(--surface)"}" stroke="var(--primary)" stroke-width="1.8"/>`).join("")}
    ${tl.map((t,i)=> i%step===0 || i===tl.length-1 ? `<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">ST ${nums[t.md.id]}</text>` : "").join("")}
    <text x="${Math.min(last[0], W-R-2)}" y="${Math.max(last[1]-9, 10)}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">${pct(lq)}</text>
  </svg>`;
}

  ${broadcastSection()}
  ${accSection("link","🔗","Liga-Link & App", "Link teilen, App neu laden", "", link)}`;

/* ---------- Bottom-Sheet ---------- */
function openModal(kind, draft){
  S.modal = kind; S.draft = draft; S.armed = null;
  $("overlay").hidden = false; renderModal(true);
}
function closeModal(){ S.modal = null; S.draft = null; $("overlay").hidden = true; if(updatePending) reloadFresh(); }
function renderModal(first){
  S._elo = null;
  const body = $("sheetBody"); const top = body.scrollTop;
  const fn = {md:modalMd, settings:modalSettings, pay:modalPay, cost:modalCost, imp:modalImport, tr:modalTransfer, player:modalPlayer, pguest:modalPollGuest, cmp:modalCompare, pp:modalPP, cal:modalCal, delled:modalDelLed, alerts:modalAlerts, res:modalRes, bc:modalBc, sv:modalSurvey, ppic:modalPic}[S.modal];
  if(!fn) return;
  const {title, html, foot} = fn();
  $("sheetTitle").textContent = title; body.innerHTML = html; $("sheetFoot").innerHTML = foot;
  if(first) body.scrollTop = 0; else body.scrollTop = top;
}

/* ---------- Runden ---------- */
/* 4 Spieler: jeder spielt genau einmal mit jedem zusammen */
function pairingsOf(p){ return [{a:[p[0],p[1]],b:[p[2],p[3]]},{a:[p[0],p[2]],b:[p[1],p[3]]},{a:[p[0],p[3]],b:[p[1],p[2]]}]; }
function standardRounds(parts){ return pairingsOf(parts).map(x => ({id:uid(), a:x.a, b:x.b, sets:emptySets()})); }
function extraRound(parts){
  const x = pairingsOf(parts)[Math.floor(Math.random()*3)];
  const flip = Math.random()<.5; const sh = t => Math.random()<.5 ? [t[1],t[0]] : [...t];
  return {id:uid(), extra:true, a:sh(flip?x.b:x.a), b:sh(flip?x.a:x.b), sets:emptySets()};
}
const hasScore = m => !!m.status;
const emptySets = () => [{a:null,b:null}];

/* ---------- Speichern ---------- */
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function write(fn){
  if(!S.db){ toast("Keine Verbindung zur Datenbank."); return false; }
  for(let attempt=0; attempt<2; attempt++){
    try{ await fn(); return true; }
    catch(e){
      const code = e?.code;
      if(code==="unavailable" && attempt===0){ await sleep(400+Math.random()*700); continue; }
      if(code==="permission-denied" || code==="invalid_argument"){ S.readOnly = true; render(); toast("Speichern abgelehnt: Du hast keine Bearbeitungsrechte."); }
      else if(code==="quota_exceeded") toast("Speicher voll: "+(e.message||""));
      else if(code==="revoked") toast("Zugriff wurde entzogen.");
      else toast("Speichern fehlgeschlagen. Bitte nochmal versuchen.");
      return false;
    }
  }
  return false;
}
let busy = false;
async function guarded(fn){ if(busy) return; busy = true; try{ await fn(); } finally { busy = false; } }

function cleanMatches(d){
  const out = [];
  for(const [i,m] of d.matches.entries()){
    const four = [...m.a,...m.b];
    const empty = four.every(x=>!x) && !m.status;
    if(empty) continue;
    if(four.some(x=>!x)) return {err:`Match ${i+1}: Bitte alle vier Spieler wählen.`};
    if(new Set(four).size!==4) return {err:`Match ${i+1}: Ein Spieler ist doppelt eingetragen.`};
    const raw = S.mdRaw.find(x=>x.id===d.id)?.matches?.find(x=>x.id===m.id);
    out.push({id:m.id||uid(), extra:!!m.extra, a:[...m.a], b:[...m.b], sets: raw?.sets ? raw.sets.map(s=>({a:s.a,b:s.b})) : []});
  }
  return {matches:out};
}
async function saveMd(){
  const d = S.draft; const c = cleanMatches(d);
  if(c.err){ toast(c.err); return; }
  if(!d.date){ toast("Bitte ein Datum angeben."); return; }
  if(d.participants.length!==4){ toast("Bitte genau 4 Spieler auswählen."); return; }
  if(c.matches.some(m => [...m.a,...m.b].some(p => !d.participants.includes(p)))){ toast("In einer Runde steht ein Spieler, der nicht dabei war."); return; }
  const parts = [...d.participants];
  c.matches.forEach(m => [...m.a,...m.b].forEach(p => { if(!parts.includes(p)) parts.push(p); }));
  const paid = {}; parts.forEach(p => { if(d.paid[p]) paid[p] = true; });
  const body = {date:d.date, location:(d.location||"").trim(), courtCost:r2(num(d.courtCost)), participants:parts, matches:c.matches, paid, note:(d.note||"").trim(), createdAt:d.createdAt||Date.now(), updatedAt:Date.now(),
    outside: !!d.outside, outsidePaidBy: d.outside ? (d.outsidePaidBy||"self") : null};
  if(d.outside && !(num(d.courtCost)>0)){ toast("Bitte die Platzkosten für den Spieltag außerhalb des Abos eintragen."); return; }
  const fresh = draftGuests().filter(g => parts.includes(g.id) || Object.keys(d.paid).includes(g.id));
  if(fresh.length){
    const okG = await write(() => S.db.doc("league/config").update({guests:[...guests(), ...fresh], updatedAt:Date.now()}));
    if(!okG) return;
  }
  const ok = await write(() => S.db.doc("matchdays/"+d.id).set(body));
  if(ok){ closeModal(); toast("Spieltag gespeichert"); }
}

  const d = S.draft;

    paypalMe:(d.paypalMe||"").trim(), paypalOwner: ps.some(p => p.id===d.paypalOwner) ? d.paypalOwner : "",
    playDays: d.playDays.length ? [...d.playDays].sort() : [2,4], startTime: d.startTime||"19:30", endTime: d.endTime||"21:00", updatedAt:Date.now()};

/* ---------- Gerätefreigabe ----------
   Jedes Gerät meldet sich still (anonym) bei Firebase an und bekommt eine feste Kennung.
   Daten lesen und schreiben dürfen nur freigegebene Kennungen (members). Neue Geräte stellen
   eine Anfrage (requests), ein Mitglied gibt sie frei. Das erste Gerät nutzt den Wiederherstellungscode. */
S.uid = null; S.member = null; S.memberChecked = false; S.myReq = null; S.members = []; S.requests = []; S.authErr = null;
let accessUnsubs = [];
const deviceLabel = () => { const u = navigator.userAgent; const t = /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) ? "iPad" : /Android/.test(u) ? "Android" : /Mac/.test(u) ? "Mac" : /Windows/.test(u) ? "Windows-PC" : "Gerät";
  const app = (window.matchMedia?.("(display-mode: standalone)").matches || navigator.standalone) ? " · Homescreen-App" : " · Browser"; return t + app; };
function isActive(m){ return !!m && m.active !== false; }
let adminUnsubs = [];
function stopData(){ S.unsubs.forEach(f => f()); S.unsubs = []; adminUnsubs.forEach(f => f()); adminUnsubs = []; S.db = null; S.config = null; S.matchdays = []; S.mdRaw = []; S.results = {}; S.ledger = []; S.votes = []; S.broadcasts = []; S.members = []; S.requests = []; }
function watchAccess(uid){
  accessUnsubs.forEach(f => f()); accessUnsubs = [];
  S.memberChecked = false;
  accessUnsubs.push(DB.doc("members/"+uid).onSnapshot(s => {
    const was = isActive(S.member); S.member = s.exists ? s.data() : null; S.memberChecked = true;
    const now = isActive(S.member);
    if(S.member?.recovery && now) DB.doc("members/"+uid).set({...S.member, recovery:null}).catch(()=>{});
    if(now && !was){ subscribe(); watchAdmin(); }
    else if(!now && was) stopData();
    render();
  }, () => { S.memberChecked = true; render(); }));
  accessUnsubs.push(DB.doc("requests/"+uid).onSnapshot(s => { S.myReq = s.exists ? s.data() : null; render(); }, () => {}));
}
function watchAdmin(){
  adminUnsubs.push(DB.collection("members").onSnapshot(q => { S.members = q.docs.map(x => ({...x.data(), id:x.id})); render(); }, () => {}));
  adminUnsubs.push(DB.collection("requests").onSnapshot(q => { S.requests = q.docs.map(x => ({...x.data(), id:x.id})); render(); }, () => {}));
}

      <div class="pname">${esc(m.pid ? pname(m.pid) : m.name)}${self?` <span class="pill info" style="vertical-align:1px">dieses Gerät</span>`:""}${guest?` <span class="pill ${act?"good":"neutral"}" style="vertical-align:1px">${act?"aktiv":"pausiert"}</span>`:""}</div>
      <div class="meta">${esc(m.device||"")} · seit ${esc(new Date(m.at||0).toLocaleDateString("de-DE"))}${guest && m.pid ? (() => { const st = standings(guests()).find(x=>x.id===m.pid); return st && st.days ? ` · ${st.days}× mitgespielt` : " · noch nicht mitgespielt"; })() : ""}</div>
      ${guest && !self ? `<button class="btn ghost sm" style="margin:2px 0 0 -11px" data-act="mem-toggle" data-id="${esc(m.id)}">${act?"Pausieren":"Aktivieren"}</button>` : ""}</div></div>
    <button class="btn sm ${armed?"danger armed":"ghost"}" style="${armed?"":"color:var(--muted)"}" data-act="mem-del" data-id="${esc(m.id)}">${armed ? (self?"Wirklich abmelden?":"Wirklich entfernen?") : (self?"Abmelden":"Entfernen")}</button></div>`;
}
function devicesCard(){
  if(!S.member) return "";
  const list = [...S.members].sort((a,b)=>(a.at||0)-(b.at||0));
  const gl = list.filter(m => m.pid && isGuest(m.pid)), pl = list.filter(m => !(m.pid && isGuest(m.pid)));
  const activeG = gl.filter(isActive).length;
  return `<section class="card"><h2>Freigegebene Geräte</h2><div class="list">${pl.map(deviceRow).join("") || `<div class="muted small">Keine.</div>`}</div>
    <p class="note">Entfernte Geräte sehen sofort keine Daten mehr und müssen neu anfragen.</p></section>
  <section class="card"><div class="card-head"><h2>Gast-Zugänge</h2>${gl.length?`<span class="pill info">${activeG} von ${gl.length} aktiv</span>`:""}</div>
    ${gl.length ? `<div class="list">${gl.map(deviceRow).join("")}</div>` : `<div class="muted small">Noch keine Gäste mit eigenem Zugang. Fragt ein Gast eine Freigabe an, erscheint er hier.</div>`}
    <p class="note">Pausierte Gäste sehen nichts, behalten aber ihre Freigabe. Spielt jemand wieder mit, einfach auf „Aktivieren“ tippen, eine neue Anfrage ist nicht nötig.</p></section>`;
}

/* Einmalige Korrektur: Tippfehler im Namen „Danlel“ → „Daniel“ */
let namesFixed = false;
function fixNames(){
  if(namesFixed || !S.config || !Array.isArray(S.config.players)) return;
  if(S.config.name==="Padel-Liga" && !S.config.renamedMasters){ write(() => DB.doc("league/config").update({name:"Padel-Masters", renamedMasters:true, updatedAt:Date.now()})); }
  if(!S.config.players.some(p => p.name==="Danlel")) return;
  namesFixed = true;
  write(() => DB.doc("league/config").update({players: S.config.players.map(p => p.name==="Danlel" ? {...p, name:"Daniel"} : p), updatedAt:Date.now()}));
}
function subscribe(){
  S.db = DB; S.denied = false; S.readOnly = false;
  S.loaded = {config:false, md:false, lg:false}; fresh.config = fresh.md = fresh.lg = false;
  const slowT = setTimeout(() => { if(!allFresh()){ S.slow = true; if(!allLoaded()) S.loaded = {config:true, md:true, lg:true}; render(); } }, 10000);
  const done = () => { if(allFresh()){ clearTimeout(slowT); S.slow = false; } };
  const onErr = e => { clearTimeout(slowT); S.loaded = {config:true, md:true, lg:true}; if(e?.code==="permission-denied") S.denied = true; else toast("Verbindung zur Datenbank unterbrochen. Seite später neu öffnen."); render(); };
  S.unsubs = [
    DB.doc("league/config").onSnapshot(s => { S.config = s.exists ? s.data() : null; S.loaded.config = true; if(!s.metadata.fromCache){ fresh.config = true; fixNames(); } done(); render(); }, onErr),
    DB.collection("results").onSnapshot(q => { S.results = Object.fromEntries(q.docs.map(x => [x.id, {...x.data(), id:x.id}])); mergeResults(); render(); }, () => {}),
    DB.collection("matchdays").onSnapshot(q => { S.mdRaw = q.docs.map(x => ({...x.data(), id:x.id})); mergeResults(); S.loaded.md = true; if(!q.metadata.fromCache) fresh.md = true; done(); render(); }, onErr),
    DB.collection("ledger").onSnapshot(q => { S.ledger = q.docs.map(x => ({...x.data(), id:x.id})); S.loaded.lg = true; if(!q.metadata.fromCache) fresh.lg = true; done(); render(); }, onErr),
    DB.collection("votes").onSnapshot(q => { S.votes = q.docs.map(x => ({...x.data(), id:x.id})); render(); }, () => {}),
    DB.collection("surveys").onSnapshot(q => { S.surveys = q.docs.map(x => ({...x.data(), id:x.id})); render(); }, () => {}),
    DB.collection("svotes").onSnapshot(q => { S.svotes = q.docs.map(x => ({...x.data(), id:x.id})); render(); }, () => {}),
    DB.collection("pinpays").onSnapshot(q => { S.pinpays = q.docs.map(x => ({...x.data(), id:x.id})); render(); }, () => {}),
    DB.collection("comments").onSnapshot(q => { S.comments = q.docs.map(x => ({...x.data(), id:x.id})); render(); }, () => {}),
    DB.collection("avatars").onSnapshot(q => { S.avatars = Object.fromEntries(q.docs.map(x => [x.id, x.data()])); render(); }, () => {}),
    DB.collection("doorcodes").onSnapshot(q => { S.doorcodes = Object.fromEntries(q.docs.map(x => [x.id, x.data()])); render(); }, () => {}),
    DB.collection("rides").onSnapshot(q => { S.rides = q.docs.map(x => ({...x.data(), id:x.id})); render(); }, () => {}),
    DB.doc("system/push").onSnapshot(sn => { S.pushRun = sn.exists ? (sn.data().lastRun || null) : null; render(); }, () => {}),
    DB.collection("broadcasts").onSnapshot(q => { S.broadcasts = q.docs.map(x => ({...x.data(), id:x.id})); render(); }, () => {})
  ];
}
S.authChecked = true;
isMsgSupported().then(ok => { if(ok) onMessage(getMessaging(fbApp), p => toast((p.notification?.title||"") + (p.notification?.body ? " · " + p.notification.body : ""))); }).catch(() => {});
if(LIGA){
  onAuthStateChanged(auth, u => { S.uid = u ? u.uid : null; if(u) watchAccess(u.uid); render(); });
  signInAnonymously(auth).catch(e => {
    S.authErr = e?.code==="auth/operation-not-allowed" || e?.code==="auth/admin-restricted-operation"
      ? "In Firebase ist die anonyme Anmeldung noch nicht eingeschaltet (Authentication → Anmeldemethode → Anonym)."
      : "Keine Verbindung. Prüfe deine Internetverbindung und lade neu.";
    render(); });
}
render();
</script>
