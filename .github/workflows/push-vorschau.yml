name: Push-Vorschau (nur Michael)
on:
  workflow_dispatch: {}
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0
      - env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          LIGA_CODE: ${{ secrets.LIGA_CODE }}
        run: node scripts/vorschau-push.mjs
